x-app-image: &app-image
  image: hiilikartta-data-service-prod
  pull_policy: build
  build:
    context: .
    no_cache: true

services:
  app-prod:
    <<: *app-image
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # NOTE: use an internal-only alias to avoid cross-talk when multiple
      # compose stacks share the external `proxy-net` (e.g. prod + test).
      REDIS_HOST: "redis-queue"
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ${DATA_PATH}:/app/data
    entrypoint: ["/bin/bash", "/app/docker-entrypoint.prod.sh"]
    networks:
      - app-net
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=proxy-net"
    #   - "traefik.http.routers.hiilikartta-${TRAEFIK_STACK}.rule=Host(`${DOMAIN}`)"
    #   - "traefik.http.routers.hiilikartta-${TRAEFIK_STACK}.entrypoints=websecure"
    #   - "traefik.http.routers.hiilikartta-${TRAEFIK_STACK}.tls.certresolver=myresolver"
    #   - "traefik.http.routers.hiilikartta-${TRAEFIK_STACK}.service=hiilikartta-${TRAEFIK_STACK}"
    #   - "traefik.http.services.hiilikartta-${TRAEFIK_STACK}.loadbalancer.server.port=80"


  worker-prod:
    <<: *app-image
    env_file:
      - ./.env
    environment:
      REDIS_HOST: "redis-queue"
    volumes:
      - ${DATA_PATH}:/app/data
    ports:
      - "127.0.0.1:${SAQ_WEB_PORT}:8080"
    entrypoint: ["/bin/bash", "/app/docker-entrypoint-worker.prod.sh"]
    networks:
      - app-net
    depends_on:
      app-prod:
        condition: service_started
      redis-prod:
        condition: service_started
    restart: unless-stopped

  redis-prod:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - ${REDIS_DATA_PATH}:/data
    networks:
      app-net:
        aliases:
          - redis-queue

  state-db-test:
    image: postgres:15-alpine
    profiles:
      - test
    environment:
      POSTGRES_DB: ${STATE_PG_TEST_DB}
      POSTGRES_USER: ${STATE_PG_TEST_USER}
      POSTGRES_PASSWORD: ${STATE_PG_TEST_PASSWORD}
    volumes:
      - state-db-test-data:/var/lib/postgresql/data
    networks:
      - app-net

  autoheal-prod:
    image: willfarrell/autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

networks:
  app-net:
volumes:
  state-db-test-data:
