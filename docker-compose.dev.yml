version: "3.8"

services:
  app-dev:
    build: .
    image: hiilikartta-data-service
    env_file:
      - ./.env
    environment:
      REDIS_HOST: "redis-dev"
      REDIS_PORT: "6379"
    ports:
      - "${DEV_PORT}:80"
      - "${NOTEBOOK_PORT}:8888"
    volumes:
      - .:/app:z
      - ./.cache:/root/.cache
      - ./.vscode-server:/root/.vscode-server
      - python-dev:/root/dev
    entrypoint: ["/bin/bash", "/app/docker-entrypoint.dev.sh"]
    restart: unless-stopped
    networks:
      - climate-map-network
    deploy:
      resources:
        limits:
          memory: 24G

    depends_on:
      state-db-dev:
        condition: service_started
      pgbouncer-state-dev:
        condition: service_started

  worker-dev:
    build: .
    image: hiilikartta-data-service
    # command: poetry run watchmedo auto-restart --directory='app' --recursive -- saq app.saq_worker.settings --workers 3 --web
    env_file:
      - ./.env
    environment:
      REDIS_HOST: "redis-dev"
      REDIS_PORT: "6379"
    volumes:
      - ./project:/usr/src/app
      - .:/app:z
      - ./.cache:/root/.cache
    ports:
      - "${SAQ_WEB_PORT}:8080"
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/docker-entrypoint-worker.dev.sh"]
    networks:
      - climate-map-network
    depends_on:
      app-dev:
        condition: service_started
      redis-dev:
        condition: service_started

  redis-dev:
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - climate-map-network
    # volumes:
    #   - cache:/data

  state-db-dev:
    image: postgres:15-alpine
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${STATE_PG_DB}
      POSTGRES_USER: ${STATE_PG_USER}
      POSTGRES_PASSWORD: ${STATE_PG_PASSWORD}
    volumes:
      - ./data/state-db-dev:/var/lib/postgresql/data
    networks:
      - climate-map-network

  state-db-test:
    image: postgres:15-alpine
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${STATE_PG_TEST_DB}
      POSTGRES_USER: ${STATE_PG_TEST_USER}
      POSTGRES_PASSWORD: ${STATE_PG_TEST_PASSWORD}
    volumes:
      - state-db-test-data:/var/lib/postgresql/data
    networks:
      - climate-map-network

  pgbouncer-gis-dev:
    image: edoburu/pgbouncer:latest
    env_file:
      - ./.env
    restart: unless-stopped
    environment:
      DB_HOST: ${GIS_PG_HOST}
      DB_PORT: ${GIS_PG_PORT}
      DB_USER: ${GIS_PG_USER}
      DB_PASSWORD: ${GIS_PG_PASSWORD}
      DB_NAME: ${GIS_PG_DB}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: session
      MAX_CLIENT_CONN: 5
      DEFAULT_POOL_SIZE: 3
      SERVER_RESET_QUERY: "DISCARD ALL"
    networks:
      - climate-map-network

  pgbouncer-state-dev:
    image: edoburu/pgbouncer:latest
    env_file:
      - ./.env
    restart: unless-stopped
    ports:
      - ${STATE_PG_OUT_PORT}:${STATE_PG_PORT}
    environment:
      # Point pgbouncer at the actual state database, not itself
      DB_HOST: state-db-dev
      DB_PORT: ${STATE_PG_PORT}
      DB_USER: ${STATE_PG_USER}
      DB_PASSWORD: ${STATE_PG_PASSWORD}
      DB_NAME: ${STATE_PG_DB}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: session
      MAX_CLIENT_CONN: 5
      DEFAULT_POOL_SIZE: 3
      SERVER_RESET_QUERY: "DISCARD ALL"
    networks:
      climate-map-network:
        aliases:
          - pgbouncer-state

  pgbouncer-state-test:
    image: edoburu/pgbouncer:latest
    env_file:
      - ./.env
    restart: unless-stopped
    ports:
      - ${STATE_PG_TEST_OUT_PORT}:${STATE_PG_TEST_PORT}
    environment:
      # Point pgbouncer at the actual state test database, not itself
      DB_HOST: state-db-test
      DB_PORT: ${STATE_PG_TEST_PORT}
      DB_USER: ${STATE_PG_TEST_USER}
      DB_PASSWORD: ${STATE_PG_TEST_PASSWORD}
      DB_NAME: ${STATE_PG_TEST_DB}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: session
      MAX_CLIENT_CONN: 5
      DEFAULT_POOL_SIZE: 3
      SERVER_RESET_QUERY: "DISCARD ALL"
    networks:
      climate-map-network:
        aliases:
          - pgbouncer-state-test

  # dashboard:
  #   build: .
  #   env_file:
  #     - ./.env
  #   image: hiilikartta-data-service
  #   command: poetry run celery --broker=redis://redis:6379/0 flower --port=5555
  #   volumes:
  #     - ./project:/usr/src/app
  #     - .:/app:z
  #     - ./.cache:/root/.cache
  #   ports:
  #     - 5556:5555
  #   depends_on:
  #     - app
  #     - redis
  #     - worker

networks:
  climate-map-network:
    external: true
volumes:
  python-dev:
    driver: local
  state-db-test-data:
